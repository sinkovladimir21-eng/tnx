<style>
/* Layout: one centred composition — round portrait, crystal glints around it, a three-line thank-you underneath. Single pearl theme by choice. */
:root{
  --pearl:#ecebe8; --pearl2:#dcdad6; --ink:#141213; --soft:#6d6a68; --crystal:#ffffff; --blush:#c98b86;
  --display:"Cormorant Garamond","Times New Roman",serif;
  --body:"Manrope",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 30%,var(--pearl),var(--pearl2));color:var(--ink);font-family:var(--body);
  padding-inline:16px;padding-block:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-bottom));
  min-height:100%;display:grid;place-items:center;overflow-x:hidden}
[hidden]{display:none!important}

/* black opening curtains, like the gloves */
.curtain{position:fixed;top:0;bottom:0;width:50.5%;background:var(--ink);z-index:5;transition:transform 1.3s cubic-bezier(.77,0,.18,1)}
.curtain.l{left:0}.curtain.r{right:0}
.open .curtain.l{transform:translateX(-101%)}
.open .curtain.r{transform:translateX(101%)}

main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:28px;max-width:560px;width:100%;text-align:center}
.portrait{position:relative;width:min(78vw,340px);aspect-ratio:1;max-width:100%}
.frame{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  clip-path:circle(0% at 50% 50%);transform:scale(.92);
  transition:clip-path 1.4s cubic-bezier(.65,0,.25,1) .9s,transform 1.8s cubic-bezier(.2,.7,.2,1) .9s;
  box-shadow:0 30px 60px -25px #1412137a}
.frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);display:block}
.ring{position:absolute;inset:-12px;border-radius:50%;border:1px solid #14121333;opacity:0;transition:opacity 1s 2.1s}
.open .frame{clip-path:circle(50% at 50% 50%);transform:scale(1)}
.open .ring{opacity:1}
canvas{position:absolute;inset:-30%;width:160%;height:160%;pointer-events:none}

.text{display:flex;flex-direction:column;gap:10px;align-items:center}
.line{opacity:0;transform:translateY(18px);filter:blur(6px);transition:opacity .9s,transform .9s,filter .9s}
.open .line{opacity:1;transform:none;filter:none}
.l1{font-family:var(--display);font-weight:500;font-size:clamp(36px,10vw,60px);line-height:1;letter-spacing:-.01em;text-wrap:balance;transition-delay:2.2s}
.l2{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);font-weight:700;transition-delay:2.7s}
.l3{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(44px,13vw,78px);line-height:1;transition-delay:3.3s;position:relative}
.l3 span{background:linear-gradient(100deg,var(--ink) 30%,var(--blush) 50%,var(--ink) 70%);background-size:250% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.open .l3 span{animation:shine 2.2s ease-in-out 4s 1 both}
@keyframes shine{to{background-position:0 0}}

.again{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;background:none;border:1px solid #14121340;color:var(--soft);
  border-radius:999px;padding:10px 18px;cursor:pointer;opacity:0;transition:opacity .8s 5s,color .2s,border-color .2s}
.open .again{opacity:1}
.again:hover{color:var(--ink);border-color:var(--ink)}
.again:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .curtain{display:none}
  .frame,.ring,.line,.again{transition:none!important}
  .open .l3 span{animation:none;color:var(--ink)}
}
</style>
</head>

  <div class="text">
    <div class="line l1">Спасибо тебе большое</div>
    <div class="line l2">от всей команды товаров</div>
    <div class="line l3"><span>ты лучшая</span></div>
  </div>
  <button class="again" id="again">Ещё раз</button>
</main>

<script>
const root=document.documentElement;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('glints'),ctx=cv.getContext('2d');
let W,H,parts=[],t0=0,raf;
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
function burst(){
  parts=[];
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2, sp=1.2+Math.random()*3.2;
    parts.push({x:W/2+Math.cos(a)*W*.2,y:H/2+Math.sin(a)*H*.2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      s:2+Math.random()*5,life:0,max:90+Math.random()*90,tw:Math.random()*6});
  }
  // a few slow glints that stay around the circle
  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,R=W*.34+Math.random()*W*.06;
    parts.push({x:W/2+Math.cos(a)*R,y:H/2+Math.sin(a)*R,vx:0,vy:0,s:3+Math.random()*4,life:-Math.random()*120,max:1e9,tw:Math.random()*6,stay:1});}
}
function star(x,y,s,a){
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.shadowColor='rgba(60,52,48,.55)';ctx.shadowBlur=s*1.2;
  ctx.beginPath();
  for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.18,s*.18,0,s*1.6);ctx.quadraticCurveTo(-s*.18,s*.18,0,0);}
  ctx.fill();
  ctx.globalAlpha=a*.9;ctx.fillStyle='#b9b4ae';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,s*.22,0,7);ctx.fill();
  ctx.restore();
}
function tick(){
  ctx.clearRect(0,0,W,H);
  parts.forEach(p=>{
    p.life++; if(p.life<0) return;
    p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;
    const k=p.stay?(.35+.65*Math.abs(Math.sin(p.life*.03+p.tw))):Math.max(0,1-p.life/p.max);
    star(p.x,p.y,p.s,k);
  });
  raf=requestAnimationFrame(tick);
}
function play(delay=350){
  root.classList.remove('open');
  cancelAnimationFrame(raf);ctx.clearRect(0,0,W||0,H||0);
  void document.body.offsetWidth;
  setTimeout(()=>{
    root.classList.add('open');
    size();
    if(!still){setTimeout(()=>{burst();tick();},1900);}
  },delay);
}
addEventListener('resize',size);
document.getElementById('again').onclick=()=>play(1500);
play();
</script>
